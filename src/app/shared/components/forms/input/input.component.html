@if(type() === 'text') {
    <mat-form-field class="input-default">
        <mat-label>{{label() ?? ''}}</mat-label>
        <input matInput 
        [placeholder]="placeholder() ?? ''" 
        [value]="value() ?? ''"
        [type]="type()"
        >
    </mat-form-field>
}
@if(type() === 'email') {
    <mat-form-field class="input-default">
        <mat-label>{{label() ?? ''}}</mat-label>
        <input matInput 
        [placeholder]="placeholder() ?? ''" 
        [value]="value() ?? ''"
        [type]="type()"
        >
    </mat-form-field>
}
@if(type() === 'tel') {
    <mat-form-field class="input-default">
        <mat-label>{{label() ?? ''}}</mat-label>
        <input matInput 
        [placeholder]="placeholder() ?? ''" 
        [value]="value() ?? ''"
        [type]="type()"
        >
    </mat-form-field>
}
@if(type() === 'password') {
    <mat-label>{{label() ?? ''}}</mat-label>
    <input matInput 
    [placeholder]="placeholder() ?? ''" 
    [value]="value() ?? ''"
    [type]="type()"
    >
}
@if(type() === 'date') {
  <mat-label>{{label()}}</mat-label>
  <input matInput [matDatepicker]="picker">
  <mat-hint>{{placeholder() ?? 'dd/mm/aaaa' }}</mat-hint>
  <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
}

@if(routerLink()) {
    <a [matButton]="buttonType()" 
       [routerLink]="routerLink() ?? ''" 
       (click)="onClick($event)" 
       class="title"
       [class]="colorClass()">
        @if(icon()) {
            <svg [lucideIcon]="icons[icon() ?? 'LucidePlus']"></svg>
        }
        {{labelButton()}}
    </a>
} @else if(buttonType() === 'text') {
    <span class="wrapper"
          [matTooltip]="disabled() && tooltip() ? tooltip() : ''">
        <button [matButton]="buttonType()"
                (click)="onClick($event)"
                [disabled]="disabled()"
                [matTooltip]="disabled() && tooltip() ? tooltip() : ''"
                [class]="'title ' + colorClass()">
            @if(icon()) {
                <svg [class.red]="icon()=== 'LucideTrash2'"
                     [class.key]="icon() === 'LucideKeyRound'"
                     [lucideIcon]="icons[icon()!]">
                </svg>
            }
            {{ labelButton() }}
        </button>
    </span>
} @else {
    <div class="wrapper"
         [matTooltip]="disabled() && tooltip() ? tooltip() : ''"
         [matTooltipPosition]="'left'">
        <button [matButton]="buttonType()"
                [routerLink]="routerLink()"
                [disabled]="disabled()"
                (click)="onClick($event)"
                [class]="'title ' + colorClass()">
            @if(icon()) {
                <svg [lucideIcon]="icons[icon()!]"></svg>
            }
            {{ labelButton() }}
        </button>
    </div>
}

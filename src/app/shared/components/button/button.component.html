@if(routerLink()) {
    <a  [matButton]="buttonType()" [routerLink]="routerLink() ?? ''" (click)="onClick($event)" class="title"
    [class.primary-color-button-filled]="buttonType() !== 'outlined'"
    >
    @if(icon()) {
        <lucide-icon [img]="icons[icon() ?? 'Plus']"
        ></lucide-icon>
    }
        {{labelButton()}}
    </a>
}
@else if(exportable()) {
    <button  [matButton]="buttonType()" [routerLink]="routerLink()" (click)="onClick($event)" class="title"
    [class.primary-color-button-outlined]="buttonType() !== 'outlined'"
    >
    @if(icon()) {
        <lucide-icon [img]="icons[icon() ?? 'Plus']"
        ></lucide-icon>
    }
        {{labelButton()}}
</button>
}
@else if(buttonType() === 'text'){
    <button
    [matButton]="buttonType()"
    (click)="onClick($event)"
    [class]="'primary-color-button--' + buttonType()"
    class="title">

    @if(icon()) {
        <lucide-icon
        [img]="icons[icon()!]">
        </lucide-icon>
    }

    {{ labelButton() }}
    </button>
}

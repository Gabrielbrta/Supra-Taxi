<aside> 
    <div class="logo-container" [class.center]="this.isClose">
        <span class="bg-logo">
            <lucide-icon class="logo" [img]="icons.Car"></lucide-icon>        
        </span>
        @if(!this.isClose) {
            <div class="title-name">
                <h2 class="Logo">Supra Táxi</h2>
                <p class="text-muted light">Gestão de Cooperativas</p>
            </div>
        }
    </div>
    <div class="button-control-container">
        <button
            (click)="toggleClose()"
        >
        <lucide-icon [img]=" this.isClose ? icons.ChevronRight: icons.ChevronLeft"></lucide-icon>
        @if(!this.isClose) {
            <p>Recolher menu</p>
        }
        </button>

    </div>
    <app-menu-items
    [closedMenu]="isClose"
    [menuItems]="menuItems"
    >
    </app-menu-items>

</aside>

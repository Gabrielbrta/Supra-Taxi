<aside> 
    <div class="logo-container" [class.center]="this.isClose">
        <span class="bg-logo">
            <svg class="logo" [lucideIcon]="icons.LucideCar"></svg>        
        </span>
        @if(!this.isClose) {
            <div class="title-name">
                <h2 class="Logo">Supra Táxi</h2>
                <p class="text-muted light">Gestão de Cooperativas</p>
            </div>
        }
    </div>
    <div class="button-control-container">
        <button
            (click)="toggleClose()"
        >
        <svg [lucideIcon]=" this.isClose ? icons.LucideChevronRight: icons.LucideChevronLeft"></svg>
        @if(!this.isClose) {
            <p>Recolher menu</p>
        }
        </button>

    </div>
    <app-menu-items
    [closedMenu]="isClose"
    [menuItems]="menuItems"
    >
    </app-menu-items>

</aside>

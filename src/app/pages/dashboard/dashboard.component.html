<div class="container">
    <div class="container-cards-info">
        <app-card-info
        [title]="'1.284'"
        [description]="'Motoristas Ativos'"
        [icon]="'Car'"
        [stats]="'1200'"
        [typeIconStatus]="'data'"
        [statsIcon]="'ClipboardCheck'"
        >
        </app-card-info>
        <app-card-info
        [title]="'1.284'"
        [description]="'Associados Ativos'"
        [icon]="'Users'"
        [stats]="'12'"
        [typeIconStatus]="'data'"
        [statsIcon]="'ClipboardCheck'"
        >
        </app-card-info>
        <app-card-info
        [title]="'1.284'"
        [description]="'Vistorias Registradas'"
        [icon]="'ClipboardCheck'"
        [stats]="'12'"
        [typeIconStatus]="'approved'"
        [statsIcon]="'ClipboardCheck'"
        >
        </app-card-info>
        <app-card-info
        [title]="'1.284'"
        [description]="'Documentos Pendentes'"
        [icon]="'TriangleAlert'"
        [stats]="'12'"
        [typeIconStatus]="'denied'"
        [statsIcon]="'ClipboardCheck'"
        >

    <div class="container-table">
        <app-card>
            <app-table
            [displayedColumns]="tableColumns"
            [dataSource]="dataSource"
            [actions]="actions"
            (actionClick)="actionClick($event)"
            >
            </app-table>
        </app-card>
        <app-card>
            <app-table
            [displayedColumns]="tableColumns"
            [dataSource]="dataSource"
            (actionClick)="actionClick($event)"
            >
            </app-table>
        </app-card>
    </div>
</div>

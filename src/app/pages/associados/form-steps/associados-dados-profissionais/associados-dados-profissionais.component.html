<div [formGroup]="formGroup()">
        <div class="wrapper-group">
        <app-input
        [label]="'CPEST'"
        [type]="'text'"
        [required]="true"
        [placeholder]="'00000'"
        formControlName="cpest"
        >
        </app-input>
    </div>
    <div class="wrapper-group">
        <app-input
        [label]="'RCT'"
        [type]="'text'"
        [required]="true"
        [placeholder]="'00000'"
        formControlName="rct"
        >
        </app-input>
        <app-input
        [label]="'Data Vencimento RCT'"
        [type]="'date'"
        [required]="true"
        [placeholder]="''"
        formControlName="rctDataValidade"
        >
        </app-input>
        <app-input
        [label]="'Data Emissão RCT'"
        [type]="'date'"
        [required]="false"
        [placeholder]="''"
        formControlName="rctDataEmissao"
        >
        </app-input>
    </div>
    <div class="wrapper-group">
        <app-input-select
        [label]="'Situação'"
        [placeholder]="'Selecione um item'"
        [selectSource]="selectSource"
        [required]="true"
        formControlName="situacao"
        >
        </app-input-select>
        <app-select-autocomplete
        [options]="[
            {id: 'adsada', nome:'P501'},
            {id: 'asdweqs', nome:'P502'},
            {id: '513412', nome:'P503'},
        ]"
        [label]="'Unidades'"
        [required]="true"
        formControlName="unidades"
        >
        </app-select-autocomplete>


    </div>

</div>
